name: Build & Release TerraSync APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Patched Kurdish SDF Glyph PBFs (64256-64511 & 8192-8447)
        run: |
          pip install --no-cache-dir uharfbuzz freetype-py
          python3 scripts/build_kurdish_glyph_pbf.py --out-dir app/src/main/assets/fonts
          ls -lh app/src/main/assets/fonts/*.pbf
      - name: Install Rust Toolchain (Android Targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache Rust Core
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Run Rust Core Unit Tests
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust Android JNI Library (arm64-v8a)
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "${ANDROID_HOME}/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
            NDK_DIR="${ANDROID_HOME}/ndk/27.2.12479018"
          fi
          export ANDROID_NDK_HOME="$NDK_DIR"
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          cd rust-core
          cargo ndk -t arm64-v8a --platform 24 -o ../app/src/main/jniLibs build --release
          ls -lh ../app/src/main/jniLibs/*/*.so
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.p12
          fi

      - name: Run Unit Tests (-Xmx128m Stress + Robolectric SQLite)
        run: |
          gradle testDebugUnitTest --tests "*TerraSyncCoreStressTest" -PunitTestMaxHeap=128m --no-daemon
          gradle testDebugUnitTest --tests "*OfflineRoutingAndStoreRobolectricTest" -PunitTestMaxHeap=512m --no-daemon

      - name: Build Signed Release APK
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE || 'release-keystore.p12' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/release/app-release.apk "TerraSync-Rust-${VERSION}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: TerraSync-release
          path: TerraSync-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TerraSync-*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
