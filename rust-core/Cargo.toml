[package]
name = "terrasync_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "terrasync_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
jni = "0.21"
quick-xml = "=0.37.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
